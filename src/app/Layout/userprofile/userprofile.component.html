<div class="app-content content">
  <div class="content-wrapper">
    <section class="section team-section">
      <div class="row match-height">
        <div class="col-md-4 mb-md-0 mb-5">

          <!-- Card -->
          <div class="card profile-card" style="margin-top: 60px">

            <!-- Avatar -->
            <div class="profile-avatar z-depth-1-half mb-4">
              <img src="photo" class="rounded-circle" alt="First sample avatar image">
            </div>

            <div class="card-body pt-0 mt-0">
              <!-- Name -->
              <div class="text-center">
                <h3 class="mb-1 font-weight-bold proper-case" style="color: #233855;">
                  <strong>firstName&nbsp;.lastName</strong></h3>
                <h6 class="font-weight-bold blue-text mb-2">.position</h6>
                <p><strong>Email :</strong> .email</p>
                <p style="color: #233855; font-weight: 600;">Atlantas crew management pvt ltd</p>
              </div>

            </div>
          </div>
          <!-- Card -->

        </div>

        <div class="col-md-8 mb-md-0 mb-5">
          <div class="card m-t-60">
            <div class="card-header">
              <div class="row">
                <div class="col-xl-6 col-lg-12">
                  <h4 class="card-title p-t-5 proper-case">Employee Details</h4>
                </div>

                <div class="col-xl-6 col-lg-12">
                  <div class="float-right">
                    <button class="btn btn-primary form-small p-t-3 p-b-3 m-r-5" type="button" data-toggle="tooltip"
                      data-trigger="hover" data-placement="top" data-title="Change Password"><i class="fas fa-edit"
                        aria-hidden="true"></i> Change Password</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="card-content">
              <div class="card-body pt-0">
                <div class="table-responsive">
                  <table class="table">
                    <tbody>
                      <tr>
                        <th width="15%">Username</th>
                        <!-- <td width="35%">{{user.userName}}</td> -->
                        <!-- <th width="15%">DOB</th>
                              <td width="35%">{{user.dob| date:'dd-MMM-yyyy'}}</td> -->
                      </tr>
                      <tr>
                        <th>User code</th>
                        <!-- <td>{{user.userCode}}</td> -->
                        <th>Mobile</th>
                        <!-- <td>{{user.mobileCode}} {{user.mobile}}</td> -->
                      </tr>
                      <tr>
                        <th>Date of Joining</th>
                        <!-- <td>{{user.joiningDate | date:'dd-MMM-yyyy'}}</td> -->
                        <th>City</th>
                        <!-- <td>{{user.city?.cityName}}</td> -->
                      </tr>
                      <tr>
                        <th>Department</th>
                        <!-- <td>{{user.designation?.department}}</td> -->
                        <th>State</th>
                        <!-- <td>{{user.state?.stateName}}</td> -->
                      </tr>
                      <tr>
                        <th>&nbsp;</th>
                        <td>&nbsp;</td>
                        <th>Country</th>
                        <!-- <td>{{user.country?.countryName}}</td> -->
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>


    </section>
  </div>
</div>
