<app-applicantdetailnav> </app-applicantdetailnav>
<div class="app-content content pt-2">
    <div class="content-wrapper">

        <div class="content-body">
            <div class="row match-height" id="switch">
                <div class="col-lg-12 col-md-12 col-12">
                    <div class="card">
                        <div class="card-body">
                            <form (ngSubmit)="onSubmit(experiencefrm)" [formGroup]="experiencefrm">
                                <div class="card collapse-icon accordion-icon-rotate left border border-light mb-0">
                                    <div class="card-header p-1 box-shadow-1 bg-primary">
                                        <a data-toggle="collapse" href="#Experience-Details" aria-expanded="true"
                                            class="card-title lead text-white">Experience Details</a>
                                    </div>
                                    <div id="Experience-Details" role="tabpanel" class="collapse show">
                                        <div class="card-content">
                                            <div class="card-body">
                                                <div class="form-body">
                                                    <h4 class="form-section"><i class="ft-user"></i> DECK OFFICERS :
                                                        (Last 5 years)</h4>
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Cargoes Carried</label>
                                                                <input type="text" class="form-control" placeholder=""
                                                                    formControlName="cargoesCarried" name="fname">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Trading Pattern</label>
                                                                <input type="text" class="form-control" placeholder=""
                                                                    formControlName="tradingPattern">
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <h4 class="form-section"><i class="ft-user"></i> ENGINEERS /
                                                        ELECTRICAL OFFICERS / DECK OFFICERS : (Last 5 years)</h4>
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Experience on deck / cargo Machinery</label>
                                                                <input type="text" class="form-control" placeholder=""
                                                                    formControlName="experienceDeckCargo" name="fname">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Experience on grabs</label>
                                                                <input type="text" class="form-control"
                                                                    formControlName="experienceOnGrabs" placeholder="">
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Experience on pumps on tankers (for deck
                                                                    officers
                                                                    & Engineers)</label>
                                                                <input type="text" class="form-control"
                                                                    formControlName="experienceOnPumpsTankers"
                                                                    placeholder="" name="fname">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Experience on computerized PMS</label>
                                                                <input type="text" class="form-control"
                                                                    formControlName="experienceOnPMS" placeholder="">
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card collapse-icon accordion-icon-rotate left border border-light mb-0">
                                    <div class="card-header p-1 box-shadow-1 bg-primary">
                                        <a data-toggle="collapse" href="#Medical-History" aria-expanded="false"
                                            class="card-title lead collapsed text-white">Medical History</a>
                                    </div>
                                    <div id="Medical-History" role="tabpanel" class="collapse border"
                                        aria-expanded="false">
                                        <div class="card-content">
                                            <div class="card-body">
                                                <div class="form-body">
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Have you ever signed off a ship due to
                                                                    medical
                                                                    reasons?</label>
                                                                <select class="form-control"
                                                                    formControlName="signedOffShip">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Have you undergone any operation in the past?
                                                                </label>
                                                                <select class="form-control"
                                                                    formControlName="operationInThePast">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Have you consulted a doctor during the last
                                                                    12
                                                                    months for an illness/accident? </label>
                                                                <select class="form-control"
                                                                    formControlName="consultedDoctor">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Do you have any health or disability problems
                                                                    now?</label>
                                                                <select class="form-control"
                                                                    formControlName="disabilityProblem">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-12">
                                                            <div class="form-group">
                                                                <label>(If the answer is YES to any of the above,
                                                                    please
                                                                    give full details and attach a separate page if
                                                                    necessary) </label>
                                                                <textarea rows="5" class="form-control"
                                                                    formControlName="medicalHistoryDetails"></textarea>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card collapse-icon accordion-icon-rotate left border border-light">
                                    <div class="card-header p-1 box-shadow-1 bg-primary">
                                        <a data-toggle="collapse" href="#General" aria-expanded="false"
                                            class="card-title lead collapsed text-white">General</a>
                                    </div>
                                    <div id="General" role="tabpanel" class="collapse border" aria-expanded="false">
                                        <div class="card-content">
                                            <div class="card-body">
                                                <div class="form-body">
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Have you ever been the subject of a court of
                                                                    enquiry or involved in a maritime
                                                                    accident?</label>
                                                                <select class="form-control"
                                                                    formControlName="maritimeAccident">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Have you ever had a professional licence
                                                                    suspended or revoked?</label>
                                                                <select class="form-control"
                                                                    formControlName="licenseSuspendedRevoked">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Have you been the subject of a court of
                                                                    enquiry
                                                                    or involved in a maritime accident?</label>
                                                                <select class="form-control"
                                                                    formControlName="courtOfEnquiry">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Have you ever been denied a foreign visa
                                                                </label>
                                                                <select class="form-control"
                                                                    formControlName="deniedForeignVisa">
                                                                    <option value="none" selected="" disabled="">
                                                                        Please
                                                                        Select</option>
                                                                    <option value="Yes">Yes</option>
                                                                    <option value="No">No</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-12">
                                                            <div class="form-group">
                                                                <label>If YES, please give full details and attach a
                                                                    separate page if necessary </label>
                                                                <textarea rows="5" class="form-control"
                                                                    formControlName="generalDetails"></textarea>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <div class="float-right">
                                    <button type="button" class="btn btn-warning mr-1">
                                        <i class="ft-x"></i> Cancel
                                    </button>
                                    <button type="submit" *ngIf="!isReferenceExist" class="btn btn-primary">
                                        <i class="fa fa-check-square-o"></i> Submit
                                    </button>
                                    <button type="submit" *ngIf="isReferenceExist" class="btn btn-primary">
                                        <i class="fa fa-check-square-o"></i> Update
                                    </button>
                                </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
